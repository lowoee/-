<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>零售业务 贡献过半营收</title>
<style>
  body { margin: 0; width: 375px; background: #F1EEF8; font-family: "PingFang SC", sans-serif; color: #1F1F1F; }
  .card { margin: 10px; background: #fff; border-radius: 14px; padding: 14px 16px 14px; }
  .brand { display: inline-block; font-size: 12px; font-weight: 700; color: #7B3FE4; background: #EDE6FB; border-radius: 8px; padding: 3px 10px; }
  h1 { font-size: 28px; line-height: 36px; font-weight: 800; margin: 12px 0 4px; letter-spacing: 0.5px; }
  h1 em { font-style: normal; color: #7B3FE4; }
  .dek { font-size: 12px; color: #6B6B6B; margin: 0; }
  section { margin-top: 16px; }
  h2 { font-size: 15px; font-weight: 600; margin: 0 0 6px; color: #222; }
  svg { display: block; }
  .panels { display: grid; grid-template-columns: 1fr 1fr; column-gap: 12px; row-gap: 14px; }
  h3 { font-size: 13px; font-weight: 600; margin: 0 0 2px; color: #222; }
  table { width: 100%; border-collapse: separate; border-spacing: 0 4px; font-size: 12px; }
  th { text-align: left; font-weight: 500; color: #666666; padding: 0 8px; }
  td { padding: 7px 8px; }
  td:first-child { border-radius: 6px 0 0 6px; font-weight: 600; }
  td:last-child { border-radius: 0 6px 6px 0; }
  footer { border-top: 1px solid #BBBBBB; padding-top: 8px; }
  footer p { font-size: 11px; line-height: 17px; color: #6B6B6B; margin: 0; }
</style>
</head>
<body>
<div class="card">
<div class="brand">财报速览</div>
<h1>零售业务<br>贡献过半<em>营收</em></h1>
<p class="dek">汇通银行 2026 年上半年营收构成</p>
<section><h2>各业务营收占比</h2>
<svg class="chart hbar-chart" width="323" height="166" viewBox="0 0 323 166" xmlns="http://www.w3.org/2000/svg" font-family="PingFang SC, sans-serif">
<text class="unit" x="0" y="12" font-size="11" fill="#666666">%</text>
<text class="cat" x="0" y="44" font-size="12" fill="#1F1F1F">零售金融</text>
<rect class="bar" x="70" y="32" width="186" height="18" rx="3" fill="#7B3FE4"/>
<text class="label" x="262" y="45" font-size="12" fill="#1F1F1F">52.4</text>
<text class="cat" x="0" y="78" font-size="12" fill="#1F1F1F">公司金融</text>
<rect class="bar" x="70" y="66" width="112.9" height="18" rx="3" fill="#B9A3F0"/>
<text class="label" x="188.9" y="79" font-size="12" fill="#1F1F1F">31.8</text>
<text class="cat" x="0" y="112" font-size="12" fill="#1F1F1F">金融市场</text>
<rect class="bar" x="70" y="100" width="43" height="18" rx="3" fill="#B9A3F0"/>
<text class="label" x="119" y="113" font-size="12" fill="#1F1F1F">12.1</text>
<text class="cat" x="0" y="146" font-size="12" fill="#1F1F1F">其他</text>
<rect class="bar" x="70" y="134" width="13.1" height="18" rx="3" fill="#B9A3F0"/>
<text class="label" x="89.1" y="147" font-size="12" fill="#1F1F1F">3.7</text>
<line x1="70" x2="70" y1="26" y2="162" stroke="#BBBBBB"/>
</svg>
</section>
<footer style="margin-top: 24px">
<p>数据来源：模拟数据</p>

</footer>
</div>
</body>
</html>
